name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release (e.g. 0.1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build Universal App & Publish Release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat VERSION 2>/dev/null || echo "0.1.0")"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > VERSION
          echo "Building version: $VERSION"

      - name: Select Xcode (full Xcode is needed for universal SPM builds)
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build universal .app and zip
        run: ./package-release.sh "${{ steps.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkleprompt-v${{ steps.version.outputs.version }}-macos-universal
          path: .build/release-package/sparkleprompt-v${{ steps.version.outputs.version }}-macos-universal.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: .build/release-package/sparkleprompt-v${{ steps.version.outputs.version }}-macos-universal.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
